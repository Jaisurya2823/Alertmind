name: alertmind-prod

# Production overrides — used with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# External services (PostgreSQL, Redis) should use managed cloud services in production
# This file assumes: DB, Redis, and MinIO are external (env vars point to managed services)

services:
  app:
    restart: always
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
      update_config:
        parallelism: 1
        delay: 30s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 10s
    environment:
      NODE_ENV: production
      # In production: do NOT expose metrics port externally
      METRICS_PORT: 9090
      METRICS_ENABLED: "true"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    # Remove port mapping — Nginx handles external traffic
    ports: []

  nginx:
    image: nginx:1.27-alpine
    container_name: alertmind-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - alertmind-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # PostgreSQL and Redis are external managed services in production
  # Remove from stack — connect via DATABASE_URL and REDIS_HOST env vars
  postgres:
    profiles: ["local-only"]

  redis:
    profiles: ["local-only"]

  minio:
    profiles: ["local-only"]

# AlertMind — Kubernetes Secret Template
# NEVER commit actual values. Use sealed-secrets, vault, or external-secrets-operator.
# Create actual secret with: kubectl create secret generic alertmind-secrets --from-env-file=.env -n alertmind

apiVersion: v1
kind: Secret
metadata:
  name: alertmind-secrets
  namespace: alertmind
type: Opaque
stringData:
  DATABASE_URL: "postgresql://user:password@host:5432/alertmind_db?sslmode=require"
  REDIS_HOST: "your-redis-host"
  REDIS_PASSWORD: "your-redis-password"
  GROQ_API_KEY: "gsk_xxxxxxxxxxxx"
  AUTH_SECRET: "generate-with: node scripts/generate-secrets.js"
  JWT_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\n..."
  JWT_PUBLIC_KEY: "-----BEGIN PUBLIC KEY-----\n..."
  CSRF_SECRET: "generate-with: node scripts/generate-secrets.js"
  ENCRYPTION_KEY: "generate-with: node scripts/generate-secrets.js"
  MINIO_ENDPOINT: "your-minio-or-s3-endpoint"
  MINIO_ACCESS_KEY: "your-access-key"
  MINIO_SECRET_KEY: "your-secret-key"
  SENTRY_DSN: "https://xxxx@xxxx.ingest.sentry.io/xxxx"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://your-otel-collector:4318"

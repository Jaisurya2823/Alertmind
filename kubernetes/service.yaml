apiVersion: v1
kind: Service
metadata:
  name: alertmind
  namespace: alertmind
  labels:
    app: alertmind
spec:
  type: ClusterIP
  selector:
    app: alertmind
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP

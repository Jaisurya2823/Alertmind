# AlertMind — Nginx Production Configuration

# Rate limiting zones (defined at http block level)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=5r/m;

# Upstream — app containers (Docker Compose replicas or K8s service)
upstream alertmind_backend {
    server app:3000 fail_timeout=10s max_fails=3;
    keepalive 32;
}

# ─── HTTP → HTTPS redirect ──────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS ──────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name your-domain.com;

    # ─── TLS ──────────────────────────────────────────────────────────────
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # HSTS (6 months — only set once you're sure HTTPS works)
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains; preload" always;

    # ─── Security Headers ──────────────────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ─── Request limits ────────────────────────────────────────────────────
    client_max_body_size 12M;
    client_body_timeout 30s;
    client_header_timeout 10s;

    # ─── Gzip ──────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # ─── Static files ──────────────────────────────────────────────────────
    location /css/ {
        proxy_pass http://alertmind_backend;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /js/ {
        proxy_pass http://alertmind_backend;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        proxy_pass http://alertmind_backend;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ─── Health check (no rate limit — for load balancer probes) ──────────
    location /api/health {
        proxy_pass http://alertmind_backend;
        proxy_read_timeout 5s;
        access_log off;
    }

    # ─── Auth endpoints (strict rate limit) ───────────────────────────────
    location ~ ^/api/v1/auth/(login|register) {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://alertmind_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── AI analysis endpoint (strict rate limit) ─────────────────────────
    location ~ ^/api/v1/alerts(/upload)?$ {
        limit_req zone=ai_limit burst=3 nodelay;
        limit_req_status 429;

        # Long timeout for AI processing (up to 120s)
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
        client_max_body_size 12M;

        proxy_pass http://alertmind_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── All other API routes ──────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://alertmind_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # ─── SPA fallback (serve index.html for all non-API routes) ──────────
    location / {
        proxy_pass http://alertmind_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Block sensitive paths ────────────────────────────────────────────
    location ~ /\. { deny all; return 404; }
    location ~ /\.env { deny all; return 404; }
    location /metrics { deny all; return 404; }
    location /api/docs {
        # Only accessible from internal networks in production
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://alertmind_backend;
    }
}
